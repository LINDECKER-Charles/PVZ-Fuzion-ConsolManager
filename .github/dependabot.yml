version: 2

# Threat model, in two halves since 1.6.0.
#
# Runtime dependencies (`@clack/prompts`, `picocolors`) are installed on every
# end user's machine alongside the CLI: a compromised release there is shipped
# breakage, and it is reviewed on its own.
#
# Everything else reaches CI and maintainer machines only, through `npm ci` and
# install scripts — the bundled `dist/cli.js` carries none of it. The risk being
# managed for that half is a hijacked release of a build tool, not a CVE in
# something users run.
#
# Hence the cadence below: monthly version updates behind a cooldown, because a
# hijacked release is almost always yanked within days of publication. Security
# updates are a separate engine — they ignore `schedule`, `cooldown`, `groups`
# and `open-pull-requests-limit`, and still open the day an advisory lands.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 8

    # Latest is not safest. A malicious release is most dangerous in its first
    # hours on the registry, so let every version soak before adopting it.
    # Majors wait longest: they are the least urgent and the most disruptive.
    cooldown:
      default-days: 14
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30

    # Every group below covers all update types, majors included. Splitting a
    # lockstep pair across two PRs is what produced the `vitest ^2` +
    # `@vitest/coverage-v8 ^4` tree that had to be repaired by hand in 3026f97.
    # `exclude-patterns` on the catch-all keeps membership deterministic instead
    # of relying on group evaluation order.
    groups:
      # First, so the two packages that ship to users never get folded into a
      # dev-tooling pull request. A dependency matches the first group it
      # qualifies for.
      runtime:
        dependency-type: production
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      build-tooling:
        patterns:
          - "tsup"
          - "tsx"
          - "esbuild"
      other-dev:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
          - "typescript"
          - "@types/*"
          - "tsup"
          - "tsx"
          - "esbuild"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3

    # `semver-*-days` is npm-only; Actions tags are not semver enough for it.
    cooldown:
      default-days: 14

    groups:
      actions:
        patterns:
          - "*"
