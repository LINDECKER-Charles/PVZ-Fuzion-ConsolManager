version: 2

# Threat model: the published package has zero runtime dependencies and ships a
# single bundled `dist/cli.js`, so this tree never reaches end users. What it
# does reach is CI and maintainer machines, via `npm ci` and install scripts —
# so the risk being managed here is a compromised release of a dev dependency,
# not a CVE in something users run.
#
# Hence the cadence below: monthly version updates behind a cooldown, because a
# hijacked release is almost always yanked within days of publication. Security
# updates are a separate engine — they ignore `schedule`, `cooldown`, `groups`
# and `open-pull-requests-limit`, and still open the day an advisory lands.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 8

    # Latest is not safest. A malicious release is most dangerous in its first
    # hours on the registry, so let every version soak before adopting it.
    # Majors wait longest: they are the least urgent and the most disruptive.
    cooldown:
      default-days: 14
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30

    # Every group below covers all update types, majors included. Splitting a
    # lockstep pair across two PRs is what produced the `vitest ^2` +
    # `@vitest/coverage-v8 ^4` tree that had to be repaired by hand in 3026f97.
    # `exclude-patterns` on the catch-all keeps membership deterministic instead
    # of relying on group evaluation order.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      build-tooling:
        patterns:
          - "tsup"
          - "tsx"
          - "esbuild"
      other-dev:
        patterns:
          - "*"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
          - "typescript"
          - "@types/*"
          - "tsup"
          - "tsx"
          - "esbuild"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3

    # `semver-*-days` is npm-only; Actions tags are not semver enough for it.
    cooldown:
      default-days: 14

    groups:
      actions:
        patterns:
          - "*"
