name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Run JavaScript-based actions on Node 24 instead of the deprecated Node 20.
# See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=75 | tee pytest-output.txt

      - name: Render coverage in job summary
        if: always()
        run: |
          {
            echo "## Python ${{ matrix.python-version }} — coverage"
            echo
            echo '```'
            sed -n '/^Name *Stmts/,/^TOTAL/p' pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage XML artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  test-js:
    name: JS tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (build.js needs it for zipapp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install npm dev dependencies
        run: npm install

      - name: Run JS tests with coverage (75% gate)
        run: npm run test:cov | tee js-output.txt

      - name: Render coverage in job summary
        if: always()
        run: |
          {
            echo "## Node ${{ matrix.node-version }} — coverage"
            echo
            echo '```'
            awk '/^-+\|/{table=1} table' js-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JS coverage report
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
