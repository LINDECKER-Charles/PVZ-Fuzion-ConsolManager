name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate: the published package ships with zero runtime dependencies, so a
      # high/critical advisory in production deps is a real, shippable risk.
      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      # Informational: surface dev-toolchain advisories without blocking CI.
      # Dependabot opens PRs to keep these patched.
      - name: Audit all dependencies (informational)
        run: npm audit || true
