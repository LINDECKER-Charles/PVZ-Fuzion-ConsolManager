[project]
name = "pvz-console"
version = "0.2.0"
description = "Translation toolkit for Plants vs Zombies: Fusion — reports, migrations and Trello exports."
authors = [
    { name = "Charles Lindecker", email = "charles.lindecker@outlook.fr" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller"]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
pvz-console = "pvz_console.cli.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pvz_console*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["pvz_console"]
omit = [
    "src/pvz_console/__main__.py",
    "src/pvz_console/cli/banner.py",
    "src/pvz_console/cli/theme.py",
    "src/pvz_console/cli/menus.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
